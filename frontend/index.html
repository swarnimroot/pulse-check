<!doctype html>
<html lang="en">
  <head>
    <!-- Ensure relative asset URLs resolve under the current mount path even
         when the page was loaded without a trailing slash. Sets a synthetic
         <base href> equal to the current directory; runs before Vite-injected
         asset tags so they pick up the correct base. -->
    <script>
      (function () {
        var p = location.pathname;
        if (!p.endsWith("/")) p += "/";
        var b = document.createElement("base");
        b.href = location.protocol + "//" + location.host + p;
        document.head.appendChild(b);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>pulse-check</title>

    <!-- System-stack pivot (session 13 + bite 11.2.d): no web fonts loaded.
         Body font stack is Arial Nova → Arial → Helvetica per DESIGN_SYSTEM §3.1. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
