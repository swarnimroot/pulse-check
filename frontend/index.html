<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- Ensure relative asset URLs resolve under the current mount path even
         when the page was loaded without a trailing slash. Sets a synthetic
         <base href> equal to the current directory; runs before Vite-injected
         asset tags so they pick up the correct base. -->
    <script>
      (function () {
        var p = location.pathname;
        if (!p.endsWith("/")) p += "/";
        var b = document.createElement("base");
        b.href = location.protocol + "//" + location.host + p;
        document.head.appendChild(b);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>pulse-check</title>

    <!-- Inter — body + UI (DESIGN_SYSTEM §3.5). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Display fallback chain per DESIGN_SYSTEM §8.3: Eurostile (proprietary) ->
         Exo 2 -> Rajdhani -> system sans. We only load the Google-hosted fallbacks. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
