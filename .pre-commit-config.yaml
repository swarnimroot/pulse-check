# pulse-check pre-commit hooks.
# Philosophy: keep commits clean; catch type + lint errors + fast unit regressions
# before they land. Per TESTING §10, full suite runs at pre-wave close, not here.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - "sqlalchemy>=2.0,<3"
          - "pydantic>=2.6,<3"
          - "pydantic-settings>=2.2,<3"
          - "types-PyYAML"
        args: [--strict]
        exclude: ^(tests/|alembic/versions/)

  - repo: local
    hooks:
      - id: pytest-unit-fast
        name: pytest unit (fast subset)
        entry: pytest tests/unit -q --no-header --maxfail=1
        language: system
        pass_filenames: false
        stages: [pre-commit]
