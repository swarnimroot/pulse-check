# Wave 5 RSS-discovery seed data (operator-supplied, session 24 close; promoted
# session 25 from `wave5_rss_sources_draft.yaml`).
#
# Loaded by `pulse_check.scraping.rss_discovery` when the run config sets
# `rss_sources: wave5_rss_sources.yaml` and `source_windows.rss.enabled: true`.
#
# YouTube channels: per-channel atom RSS at the standard YouTube pattern. The
# discovery module fetches each feed, filters by `title_keywords`, and routes
# surviving video URLs to scrapers-lib's `fetch_youtube_transcript`.
#
# Article feeds: per-site RSS. The module fetches each feed, filters by
# `title_keywords`, and routes surviving article URLs to scrapers-lib's
# `fetch_article` (trafilatura body extract).
#
# Title-filter posture (session-24 D7 / session-25 fork): case-insensitive
# substring match against the entry title. At least ONE keyword must appear.
# Operator-edit this list to tune coverage.
#
# Auto-discovery fallback: if a `rss_url` returns zero entries when parsed as
# a feed (e.g. RTINGS index page), the module fetches it as HTML and scrapes
# for `<a>`/`<link>` tags containing both a feed-ish hint ("rss"/"feed"/"xml")
# AND the keyword "laptop", then retries that discovered URL once.

title_keywords:
  - "gaming laptop"
  - "vs"
  - "comparison"
  - "laptop review"
  - "best laptop"

youtube_channels:
  - handle: "@LinusTechTips"
    display_name: "Linus Tech Tips"
