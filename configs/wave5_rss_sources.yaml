  # @LAPTOPMagazine YouTube channel above remains active.

  - site: "Tom's Hardware"
    rss_url: "http://www.tomshardware.com/feeds.xml"
    status: "GREEN"
    notes: "Future PLC standard feed pattern; ~40 items."

  - site: "PCMag"
    rss_url: "https://www.pcmag.com/feeds/rss/latest"
