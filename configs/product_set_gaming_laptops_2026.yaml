# Product set for the Wave 5 pilot run (PRD §9, operator-locked 2026-05-12).
#
# 59 products covering the 2025-2026 gaming-laptop competitive set.
# Multi-size lines split into separate products per operator (D9, D10, D11).
# Chip variants (Intel/AMD) merged into single products per operator (D13, D14).
#
# Pattern engineering notes:
#   - Source text is lowercased before matching (see anchors.py); patterns use
#     lowercase regex only.
#   - Word boundaries (\b) mandatory at edges.
#   - High-collision SKUs disambiguated with negative lookahead/lookbehind:
#     Omen 16 vs Omen Max/Slim/Transcend 16; Helios vs Helios Neo vs Predator
#     Neo 16s; Strix G vs Strix Scar vs Zephyrus; Legion 5/5i/5 Pro/7/7i/7 Pro.
#   - urls: {} for all — operator chose not to scrape retailer / manufacturer
#     / hand-seeded YouTube/Article URLs. Article + YouTube come in via the
#     rss_discovery bite (session 25) — see SESSION_LOG.

products:
