# Wave 5 first scrape (PRD §9, operator-locked 2026-05-12).
#
# Staged on a 13-product subset of the full 59-product universe (4 Alienware
# flagships + 9 nearest competitors). See pair_plan_wave5_staged.yaml.
# Full-universe scrape follows once the staged scrape validates pattern
# accuracy and cost.
#
# Source posture for the first scrape:
#   - reddit:    ENABLED, 12 subreddits, 6-month backfill.
#   - rss:       ENABLED — runs RSS-discovery from `rss_sources` at orchestrator
#                startup. Discovered URLs are enqueued against scrapers-lib's
#                existing youtube + article fetchers with all-product anchors.
#   - article/youtube (per-product seed loops): OMITTED — the 59-product config
#                has `urls: {}` everywhere, so no per-product seeds exist. RSS
#                discovery is the sole article/youtube path for Wave 5.
#   - bestbuy/amazon: DISABLED — retailer fetchers deferred per bite 6.4.
#                Operator out of scope for this pilot.

run_id: wave5_v1
product_set: product_set_gaming_laptops_2026.yaml
pair_plan: pair_plan_wave5_staged.yaml
rss_sources: wave5_rss_sources.yaml
source_windows:
  reddit:
    enabled: true
    backfill_months: 6
    subreddits:
      # Existing 6 (v1 corpus base):
      - GamingLaptops
      - SuggestALaptop
      - buildapc
      - laptops
      - Alienware
      - LenovoLegion
      # New 6 (brand subs + deal-discussion):
      - ROG
      - ASUS
      - MSILaptops
      - AcerOfficial
      - OmenByHP
      - LaptopDeals
  rss:
    enabled: true
    backfill_months: 6
taxonomy_version: v0
