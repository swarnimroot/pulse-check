# Wave 5 full-scrape posture (PRD §9, operator-locked 2026-05-12).
#
# Source posture:
#   - reddit:    enabled; 6-month backfill across 12 subreddits.
#   - rss:       enabled; 6-month backfill window.
#   - discovered_urls_sources: operator-curated Notebookcheck editorial URLs
#                (single-anchor enqueue, mirrors article_seeds; NOT RSS-broadcast).
#                Requires `article.enabled: true` for the orchestrator guard.
#   - article/youtube (per-product seed loops): OMITTED — the 59-product config
#                has `urls: {}` everywhere; RSS-discovery + discovered_urls are
#                the sole article/youtube paths.
#   - bestbuy/amazon: DISABLED — retailer fetchers deferred per pilot scope.

run_id: wave5_v1
product_set: product_set_gaming_laptops_2026.yaml
pair_plan: pair_plan_wave5_staged.yaml
rss_sources: wave5_rss_sources.yaml
# Stage-1 flip: enqueue the 33 operator-curated Notebookcheck editorial URLs
# via the discovered-URLs single-anchor path (mirrors `article_seeds`, NOT
# RSS-broadcast). Loader resolves the path relative to this YAML's directory.
discovered_urls_sources: ../data/discovered_urls/notebookcheck
source_windows:
  reddit:
    enabled: true
    backfill_months: 6
    subreddits:
      # Existing 6 (v1 corpus base):
      - GamingLaptops
      - SuggestALaptop
      - buildapc
      - laptops
      - Alienware
      - LenovoLegion
      # New 5 (brand subs + deal-discussion):
      # OmenByHP dropped session 47 — sub is restricted (consistent 403);
      # HP Omen chatter still flows via peer subs.
      - ROG
      - ASUS
      - MSILaptops
      - AcerOfficial
      - LaptopDeals
  rss:
    enabled: true
    backfill_months: 6
  # Article window must be enabled for the discovered-URLs path to enqueue
  # (orchestrator guard: sw.article.enabled AND discovered_urls is not None).
  article:
    enabled: true
taxonomy_version: v0
