# Wave 5 RSS-discovery seed data (operator-supplied, session 24 close).
#
# This file is DRAFT — not validated by a Pydantic schema yet. Session 25's
# rss_discovery bite will define the `RSSWindow` SourceWindow + load this
# data into the validated config. Until then, this file is the operator's
# locked input for the bite.
#
# YouTube: 7 review channels operator-approved at session 24 close. Channel
# IDs resolved from YouTube canonical page metadata. RSS URLs follow the
# standard pattern `https://www.youtube.com/feeds/videos.xml?channel_id=<ID>`
# and return the ~15 most-recent uploads per channel with title + link +
# published date. Title-filter happens BEFORE transcription per session-24
# D7 — surviving video URLs route to scrapers-lib's existing
# `fetch_youtube_transcript()` with all-product anchors.
#
# Article: 9 review sites operator-approved at session 24 close. Each RSS
# feed returns recent article titles + URLs. Title-filter happens BEFORE
# fetching the full article body; surviving URLs route to scrapers-lib's
# existing `fetch_article()` (trafilatura + httpx) with all-product anchors.
#
# Status legend (status set by session-24 agent verification):
#   GREEN  — feed verified, returns laptop-relevant content
#   YELLOW — feed valid but mixed-content or partial (excerpt-only / non-
#            laptop-dominant). Usable; session 25 may add per-site title
#            keyword tuning.
#   RED    — could not verify; session 25 must validate before enabling.

