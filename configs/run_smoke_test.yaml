# Smoke-test run config — exercises the full pipeline on 2 products / 1 pair.
# Short backfill windows so the smoke run completes fast.

run_id: smoke_test
product_set: product_set_smoke_test.yaml
pair_plan: pair_plan_smoke_test.yaml
source_windows:
  reddit:
    enabled: true
    backfill_months: 1
    subreddits:
      - GamingLaptops
      - Alienware
      - buildapc
      - SuggestALaptop
      - laptops
  # Retailer-review paths paused per session-7 pivot (bite 6.4 deferred).
  # Three open items: BestBuy network/Akamai timeout, pulse-check result_sink
  # mapping for ('amazon','post')/('bestbuy','post'), Amazon Strix empty page.
  # Re-enable when bite 6.4 returns. URLs in product_set_smoke_test.yaml
  # remain populated as documentation.
  bestbuy_reviews:
    enabled: false
    paginate: false
    backfill_months: 6
  amazon_reviews:
    enabled: false
  youtube:
    enabled: false
  article:
    enabled: false
taxonomy_version: v0
