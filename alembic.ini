# Alembic configuration for pulse-check.
# The `sqlalchemy.url` value here is a fallback; the real URL is read from the
# DATABASE_URL env var (via pulse_check.settings) in alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = sqlite:///data/pulse_check.db

[post_write_hooks]
# Intentionally empty. Format migrations manually with `ruff format` from the
# venv after regeneration — Alembic's console_scripts entrypoint lookup for
# ruff is unreliable on Windows venvs.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
