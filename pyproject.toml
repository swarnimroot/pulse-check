[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-check"
version = "0.1.0"
description = "Product-listening pilot engine for PC manufacturers."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "pulse-check operator" }]
license = { text = "Proprietary" }
dependencies = [
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "hypothesis>=6",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse_check*"]
exclude = ["tests*", "alembic*", "configs*", "frontend*", "docs*", "scripts*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET", "ARG"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N802"]
"alembic/versions/**" = ["N999", "E501"]
# SQLAlchemy TypeDecorator mandates the `dialect` parameter on process_* methods
# even when the decorator doesn't use it; suppress the unused-arg warning here.
"pulse_check/storage/types.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
exclude = ["alembic/versions/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["scrapers_lib.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "unit: fast offline unit tests",
  "integration: require SQLite file or fixture scrape data",
  "eval: require Ollama running locally",
]

[tool.coverage.run]
source = ["pulse_check"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
